[project]
name = "laser.cohorts"
version = "0.1.0"
description = "Cohort (MPM/compartmental), SI/SIR/SEIR/etc., disease models implemented with the LASER toolkit."
requires-python = ">= 3.10"
readme = "README.md"
license-files = ["LICENSE"]
keywords = ["sir", "seir", "spatial", "modeling", "laser"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Utilities",
]

authors = [
  {name = "Christopher Lorton", email = "christopher.lorton@gatesfoundation.org"},
  {name = "Jonathan Bloedow", email = "jonathan.bloedow@gatesfoundation.org"},
  {name = "Katherine Rosenfeld", email = "katherine.rosenfeld@gatesfoundation.org"},
  {name = "Kevin McCarthy", email = "kevin.mccarthy@gatesfoundation.org"},
  {name = "Paul R Saxman", email = "paul.saxman@gatesfoundation.org"},
]

maintainers = [
  {name = "Christopher Lorton", email = "christopher.lorton@gatesfoundation.org"},
  {name = "Paul R Saxman", email = "paul.saxman@gatesfoundation.org"}
]

dependencies = [
  "click",
  "geopandas",
  "laser.generic>=1.0.0",
  "laser.core>=1.0.0",
  "mplcursors>=0.7",
  "numpy",
  "pandas",
  "PyWavelets",
  "scikit-learn",
  "scipy",
  "tqdm",
  "uv",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "tox",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.5",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-autorefs", # create automatic linkable references to sections, etc.
    "mkdocs-exclude",
    "mkdocs-gen-files", # generate external module reference docs
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
    "mkdocs-include-markdown-plugin>=7.2.1", # include files outside /docs
    "mkdocs-jupyter", # jupyter notebooks
    "mkdocs-literate-nav", # use a SUMMARY.md file for API reference TOC
    "mkdocs-material>=9.7.5", # doc theme that includes extensive functionality
    "mkdocs-mermaid2-plugin",
    "mkdocs-section-index", # ability to create parent topics in TOC
    "mkdocs-table-reader-plugin",
    "mkdocstrings[python]>=1.0.3", # generate API reference from docstrings
    "mkdocstrings-python", # python handler for mkdocstrings
    "pymdown-extensions", # various extensions for markdown
    "python-markdown-math", # integrate LaTeX math

    # include all packages needed for running Jupyter notebooks
    "laser.core",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
]

basemaps = [
  "contextily>=1.6.2",
]

[project.urls]
Homepage = "https://github.com/InstituteforDiseaseModeling/laser-cohorts/"
Documentation = "https://institutefordiseasemodeling.github.io/laser-cohorts"
Repository = "https://github.com/InstituteforDiseaseModeling/laser-cohorts.git"
Issues = "https://github.com/InstituteforDiseaseModeling/laser-cohorts/issues"
Changelog = "https://github.com/InstituteforDiseaseModeling/laser-cohorts/blob/master/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.10.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [ "laser.cohorts" ]
source-include = [
    "AUTHORS.md", "CHANGELOG.md", "CONTRIBUTING.md", "README.md",
    "tests/test*py"
    ]

[tool.pytest.ini_options]
filterwarnings = ["error"]
markers = ["modeltest"]

[tool.ruff]
extend-exclude = ["static", "ci/templates", "*.ipynb"]
line-length = 140
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I001"]
"ci/*" = ["S"]
"notebooks/07_SIR_CCS.ipynb" = ["F", "PTH", "C", "W", "I"]
"notebooks/08_2patch_SIR_wbirths_correlation.ipynb" = ["F", "PTH", "C", "W", "I"]

ignore = [
    "RUF001", # ruff-specific rules ambiguous-unicode-character-string
    "S101", # flake8-bandit assert
    "S308", # flake8-bandit suspicious-mark-safe-usage
    "S603", # flake8-bandit subprocess-without-shell-equals-true
    "S607", # flake8-bandit start-process-with-partial-path
    "E501", # pycodestyle line-too-long
]
select = [
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "E", # pycodestyle errors
    "EXE", # flake8-executable
    "F", # pyflakes
    "I", # isort
    "INT", # flake8-gettext
    "PIE", # flake8-pie
    "PLC", # pylint convention
    "PLE", # pylint errors
    "PT", # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RSE", # flake8-raise
    "RUF", # ruff-specific rules
    "S", # flake8-bandit
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
forced-separate = ["conftest"]
force-single-line = true

[tool.ruff.format]
quote-style = "double"

[tool.bumpversion]
current_version = "0.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "🔖 Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "🔖 Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
 filename = "README.md"
search = "/v{current_version}.svg"
replace = "/v{new_version}.svg"

[[tool.bumpversion.files]]
filename = "README.md"
search = "/v{current_version}...main"
replace = "/v{new_version}...main"
