site_name: laser.cohorts Documentation
site_url: https://institutefordiseasemodeling.github.io/laser-cohorts
repo_name: InstituteforDiseaseModeling/laser-cohorts
repo_url: https://github.com/InstituteforDiseaseModeling/laser-cohorts
theme:
  name: material
  custom_dir: docs/customization/overrides
  font:
    text: Roboto
    code: Roboto Mono
  logo: images/idm-logo-transparent.png
  favicon: images/favicon.ico
  features:
    - navigation.footer # include a footer with links to privacy, terms, etc.
    - content.code.copy # enable copy buttons for code blocks
    - navigation.indexes # enable parent index page for sections
  palette:
    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: white
      accent: light blue
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: black
      accent: light blue

nav:
  - Home: index.md
  - Model: model.md
  - Components: components.md
  - Campaign & interventions: campaign.md
  - Tutorials:
    - SI logistic growth: notebooks/nb_01_si_logistic_growth.ipynb
    - SIS logistic growth: notebooks/nb_02_sis_logistic_growth.ipynb
    - SIR outbreak size: notebooks/nb_03_sir_outbreak_size.ipynb
    - SI vital dynamics: notebooks/nb_04_si_vital_dynamics.ipynb
    - SIR natural periodicity: notebooks/nb_05_sir_natural_periodicity.ipynb
    - Mortality validation: notebooks/nb_06_mortality.ipynb
    - Constant-population births: notebooks/nb_07_constant_pop.ipynb
    - Births with varying CBR: notebooks/nb_08_births_varying_cbr.ipynb
    - Seasonality: notebooks/nb_09_seasonality.ipynb
    - Two-patch spatial correlation: notebooks/nb_10_two_patch_correlation.ipynb
    - Rabies 1D diffusion: notebooks/nb_11_rabies_1d_diffusion.ipynb
    - Critical community size: notebooks/nb_12_ccs.ipynb
    - Age at first infection: notebooks/nb_13_age_at_infection.ipynb
    - Routine immunization: notebooks/nb_14_routine_immunization.ipynb
    - England & Wales spatial SEIR model: notebooks/nb_15_england_wales_model.ipynb
    - England & Wales analysis: notebooks/nb_16_ew_analysis.ipynb
    - Campaign — hub & spoke example: notebooks/nb_17_campaign_example.ipynb
    - Campaign specification formats: notebooks/nb_18_campaign_specs.ipynb
    - Surveillance and reactive campaign example: notebooks/nb_19_reactive_campaign.ipynb
  - API reference: reference/


# icons, semantic markup, emojis
markdown_extensions:
  - toc:
      toc_depth: 3
  - attr_list # enables HTMl and CSS classes to inline elements
  - md_in_html # enables grids
  - admonition # warnings, etc.
  - def_list
  - footnotes
  - pymdownx.snippets: # insert content from other files
      auto_append:
        - docs/includes/glossary.md
  - abbr # term/abbreviation hover description
  - pymdownx.emoji: # emojis and icons
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex: # Latex processing for math equations
      generic: true
  - pymdownx.snippets: # snippet reuse functionality
  - pymdownx.blocks.details: # allows nesting of collapsible code
  - pymdownx.highlight: # syntax highlighting for code blocks
      linenums: true
      default_lang: 'python'
  - pymdownx.inlinehilite # syntax highlighting for inline code
  - pymdownx.superfences: # enables code, diagram fences to be nested in lists, etc.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details # collapsible elements
  - pymdownx.tabbed: # tabbed content that can be toggled
      alternate_style: true
  - pymdownx.blocks.caption # captions for images, tables, etc.

# javascript customization for math
extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - customization/css/extra.css # custom CSS for footer spacing

# Files inside docs/ that should be completely ignored by the build.
# gitignore-style: trailing slash recursively excludes a directory and all
# its contents (top-level files, subdirectories, generated __pycache__, etc.).
exclude_docs: |
  notebooks/data/

plugins:
  - search: # search functionality
      lang: en
      separator: '[\s\-\.]+'
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - autorefs # automatically create linkable references
  - include-markdown # include other files, such as READMEs
  - table-reader # enables rendering of CSV/TSV files or tables
  - mkdocs-jupyter: # enables Jupyter notebooks to be rendered
      execute: false
      allow_errors: true
      include_source: true
  - gen-files:
      scripts:
        - docs/customization/gen-files.py
  - literate-nav:
      tab_length: 2
  - mkdocstrings: # process docstrings to generate API reference
      handlers:
        python:
          paths: [src] # path to source code
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            separate_signature: true
            merge_init_into_class: true
            docstring_section_style: table
            members_order: source
            show_if_no_docstring: false
            inherited_members: false
            filters:
              - "!^_"  # Exclude private members
            # Suppress warnings about missing type annotations
            # Types are documented in Google-style docstrings
            show_signature_annotations: false
      enable_inventory: true
  - mermaid2
  - exclude:
      glob:
        - customization/gen-files.py # exclude file generation script
        - includes/glossary.md # exclude glossary include file
        - notebooks/data/*
        - notebooks/data/**

copyright: Copyright &copy; 2026 Gates Foundation. All rights reserved.

extra:
  generator: false
  footer_links:
    - text: "Privacy and Cookies Notice"
      href: "https://www.gatesfoundation.org/Privacy-and-Cookies-Notice"
    - text: "Terms of Use"
      href: "https://www.gatesfoundation.org/Terms-of-Use"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/laser-base/laser-cohorts # update to your repo
    - icon: fontawesome/regular/envelope
      link: mailto:idm@gatesfoundation.org
    - icon: octicons/globe-24
      link: https://idmod.org
    - icon: simple/youtube
      link: http://www.youtube.com/@institutefordiseasemodelin1987
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/company/institute-disease-modeling


